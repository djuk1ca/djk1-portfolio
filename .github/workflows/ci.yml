name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Tokens are in sync with the design system
        run: npm run tokens && git diff --exit-code src/styles/tokens.css

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: End-to-end on the Worker (local D1, Turnstile test keys)
        run: |
          npx playwright install --with-deps chromium
          cp .dev.vars.example .dev.vars
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  deploy:
    needs: test
    # Runs once the Cloudflare setup in README is done (the SITE_URL repository variable exists).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SITE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Prerendered pages bake this into canonical URLs, the sitemap and Open Graph tags.
      SITE_URL: ${{ vars.SITE_URL }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:remote
      - run: npm run deploy
