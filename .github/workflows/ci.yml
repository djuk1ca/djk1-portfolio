name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Tokens are in sync with the design system
        run: npm run tokens && git diff --exit-code src/styles/tokens.css

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: End-to-end on the Worker (local D1, Turnstile test keys)
        run: |
          npx playwright install --with-deps chromium
          cp .dev.vars.example .dev.vars
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

# Deploys are done by Cloudflare Workers Builds (connected to this repo), not here. See README.
