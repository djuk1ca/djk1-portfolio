<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<title>DJK-1</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--desk); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .bezel { fill: var(--cap); }
  .scr { fill: var(--screen); }
  .ph { fill: var(--phosphor); }
  .phd { fill: var(--phosphor-dim); }
  .cap { fill: var(--cap); } .cap-s { fill: var(--cap-side); }
  .mod { fill: var(--mod); } .mod-s { fill: var(--mod-side); }
  .acc { fill: var(--accent); } .acc-s { fill: var(--accent-side); }
  .k { rx: var(--radius-key); }
  .t { rx: var(--radius-tile); }
  .s { rx: var(--radius-screen); }
  .seg { rx: 2px; }
  .words { position: absolute; left: var(--space-7); bottom: var(--space-7); max-width: 440px; }
  .name { margin: 0; font-family: var(--font-display); font-size: 104px; line-height: .92; font-weight: 900; font-stretch: 118%; letter-spacing: -.02em; color: var(--ink); }
  .tag { margin: var(--space-3) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--ink-2); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      screen 460×60 in a cap bezel 472×80 bleeding off the right (the LCD) · accent 52 and 108 wide (the one primary key, Enter and a long key) · mod 48/76/104 wide (modifiers) · cap keys for the rest; ≈45% of 960×288
  arrangement a keyboard: one screen band on top, three rows of keys below, every row bleeding off the right edge like a deck cut off by the frame
  pattern     keycap tiles from "geometric, modular, dense UI": 48×42 keys on a 56 pitch (space-8), merged two- and five-wide like real modifiers and the space bar; each key a top plus a side rect depth-key (6px) lower
  scales      pitch space-8 (56), gaps space-2 (8), depth depth-key (6); corners radius-key on keys, radius-tile on the bezel, radius-screen on the screen; phosphor segments 40×12 like the ghost "888" digits
-->
