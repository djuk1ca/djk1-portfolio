<!doctype html>
<html><head><meta charset="utf-8"><title>Key</title><style>html,body{margin:0}body{padding:20px}</style></head>
<body class="djk-root">
<div style="display:grid;gap:14px">
  <div class="djk-row">
    <button class="djk-key djk-key--accent" type="button">Start a project</button>
    <button class="djk-key" type="button">View work</button>
    <a class="djk-key djk-key--mod" href="https://github.com/djuk1ca" target="_blank" rel="noopener">GitHub <span class="djk-arrow">↗</span></a>
  </div>
  <div class="djk-row">
    <button class="djk-key djk-key--sm djk-key--accent" type="button">Live <span class="djk-arrow">↗</span></button>
    <button class="djk-key djk-key--sm" type="button">Code</button>
    <button class="djk-key djk-key--sm" type="button" aria-pressed="true">EN</button>
    <button class="djk-key djk-key--sm" type="button" aria-pressed="false">SR</button>
    <button class="djk-key djk-key--sm" type="button" disabled>Soon</button>
  </div>
</div>
</body></html>
