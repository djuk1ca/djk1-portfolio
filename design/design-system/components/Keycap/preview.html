<!doctype html>
<html><head><meta charset="utf-8"><title>Keycap</title><style>html,body{margin:0}body{padding:20px}</style></head>
<body class="djk-root">
<nav class="djk-row" aria-label="Sections">
  <a class="djk-key djk-kc" href="#" data-key="1"><b>1</b><span>Services</span></a>
  <a class="djk-key djk-kc" href="#" data-key="2"><b>2</b><span>Work</span></a>
  <a class="djk-key djk-kc djk-key--mod" href="#" data-key="3"><b>3</b><span>About</span></a>
  <a class="djk-key djk-kc djk-key--accent" href="#" data-key="4"><b>4</b><span>Contact</span></a>
</nav>
<script>
document.addEventListener('keydown', function (e) { var k = document.querySelector('.djk-kc[data-key="' + e.key + '"]'); if (k) { e.preventDefault(); k.classList.add('is-down'); } });
document.addEventListener('keyup', function (e) { var k = document.querySelector('.djk-kc[data-key="' + e.key + '"]'); if (k) k.classList.remove('is-down'); });
document.querySelectorAll('.djk-kc').forEach(function (a) { a.addEventListener('click', function (e) { e.preventDefault(); }); });
</script>
</body></html>
